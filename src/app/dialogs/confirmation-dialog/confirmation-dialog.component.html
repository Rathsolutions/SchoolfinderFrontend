<h1 mat-dialog-title>Bestätigung</h1>
<div mat-dialog-content>
  <p>{{nameOfDeletion}} wird gelöscht. Sind Sie sicher?</p>
</div>
<div mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">Abbruch</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Löschen</button>
</div>
